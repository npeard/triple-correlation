[project]
name = "triple-correlation"
version = "0.1.0"
description = "Scattering phase retrieval from triple intensity correlations"
authors = [
    {name = "Nolan Peard", email = "nolan.peard@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "matplotlib",
    "numba",
    "torch",
    "lightning",
    "h5py",
    "tqdm",
    "scikit-image",
    "mpl_point_clicker",
    "pyyaml",
]

[project.urls]
"Homepage" = "https://github.com/npeard/triple-correlation"
"Bug Tracker" = "https://github.com/npeard/triple-correlation/issues"

[build-system]
requires = ["flit_core>=3.9.0,<4"]
build-backend = "flit_core.buildapi"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--verbose"
filterwarnings = [
    # Ignore external package warnings
    "ignore::UserWarning:torch.*",
    "ignore::DeprecationWarning:torch.*",
    "ignore::FutureWarning:torch.*",
    "ignore::UserWarning:numpy.*",
    "ignore::DeprecationWarning:numpy.*",
    "ignore::UserWarning:scipy.*",
    "ignore::DeprecationWarning:scipy.*",
    "ignore::UserWarning:matplotlib.*",
    "ignore::DeprecationWarning:matplotlib.*",
    "ignore::UserWarning:lightning.*",
    "ignore::DeprecationWarning:lightning.*",
    "ignore::FutureWarning:lightning.*",
    "ignore::UserWarning:numba.*",
    "ignore::DeprecationWarning:numba.*",
    # Keep warnings from your own package (as warnings, not errors)
    "default::Warning:fluo.*",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=3.0",
    "pytest-xdist>=2.5",
    "pytest-benchmark",
]
dev = [
    "pytest>=8.0.0",
    "ruff",
    "codespell",
    "pre-commit",
    "nbstripout",
    "ty",             # Type checking
    "bandit",         # Security linting
    "coverage[toml]", # Coverage with pyproject.toml support
]

[tool.flit.module]
name = "fluo"

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = [
    "F", "E", "W", "C90", "I", "D", "UP", "YTT", "ANN", "BLE", "B", "A", "C4", "FA",
    "INP", "NPY201", "PIE", "T20", "PYI", "PT", "RSE", "RET", "SLF", "SIM", "INT",
    "ARG", "PTH", "PL", "TRY", "FLY", "NPY", "RUF", "S", "N", "PERF", "FURB",
]
extend-select = ["D204", "D400", "D404", "D406", "D410"]
ignore = [
    # Import-related (keep for __init__.py files)
    "F403", "F405",
    # Style preferences
    "E741",  # Ambiguous variable names (sometimes necessary in scientific code)
    # Documentation (reasonable for scientific/research code)
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "D205", "D405", "D417",
    # Type annotations (reasonable choices)
    "ANN002", "ANN003", "ANN401",
    # Argument usage (common in scientific APIs)
    "ARG001",
    # Return style preference
    "RET505",
    # Exception handling (reasonable for research code)
    "TRY003",
    # Complexity (reasonable limits for scientific code)
    "PLR0913", "PLR2004",
    # Private access (sometimes needed for scientific libraries)
    "SLF001",
    # Security (may need adjustment based on your needs)
    "S101",  # Use of assert (common in scientific code)
    "S311",  # Random generators (often fine for scientific use)
    # Naming (scientific computing often uses uppercase for matrices/operators)
    "N803", # Argument names should be lowercase (conflicts with math notation for matrices)
    "N806", "N802", # Variable names should be lowercase (conflicts with math notation)
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.flake8-annotations]
suppress-none-returning = true

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "N999"]
"docs/**.py" = ["INP001", "ARG001", "ANN"]
"conftest.py" = ["ANN"]
"tests/**.py" = ["ANN", "N999"]
"notebooks/**.py" = ["T201"]
"main.py" = ["T201", "S603", "S607"]
"*.ipynb" = ["ALL"]
"plots/__init__.py" = ["N999"]
"plots/PaperFigures.py" = ["N999", "N812", "E402", "NPY002", "E501", "B007", "PLW0127", "F841"]
"plots/plot1d.py" = ["N812"]
"plots/plot2d.py" = ["N812", "E402", "E501", "PLR0915"]
"plots/test_differentiable_solver.py" = ["E402", "ANN201"]
"scripts/check_ascii.py" = ["S603", "S607", "T201"]
"tests/test_cosPhi_generation.py" = ["N999"]
"biphase/solver/biphase2d.py" = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.codespell]
skip = ".git,*.ipynb"

[tool.pixi.workspace]
channels = ["conda-forge"]
# win-64 is the machine this is developed on; without it every `pixi run` here
# fails with `unsupported-platform`, which is why no .pixi/ ever existed. The
# macOS entries are dropped deliberately rather than kept alongside: nobody
# develops or runs this project on a Mac, and keeping them makes the solver
# find a torch/numpy/numba set consistent across Intel and Apple-silicon
# macOS as well, which is what historically forced backdated pins. Re-add
# them only together with someone who actually tests there.
platforms = ["win-64", "linux-64"]

[tool.pixi.dependencies]
python = ">=3.12,<3.13"
# numba deliberately comes from PyPI (via [project.dependencies]), NOT conda.
# Conda-forge's numeric packages link libomp while the PyPI torch wheels
# bundle Intel's libiomp5md.dll; loading both OpenMP runtimes in one process
# makes OpenMP abort with "OMP: Error #15". The documented
# KMP_DUPLICATE_LIB_OK escape hatch is explicitly unsafe -- its own error text
# warns it can silently produce incorrect results -- so instead keep a single
# OpenMP runtime by sourcing the whole numeric stack (numpy, numba, torch)
# from one place. Do not move numba back here.
#
# ruff and codespell live in the *default* env because [tool.pixi.tasks]
# (below) runs in the default env and defines `format`, `lint` and `spell` in
# terms of them. While they were dev-feature-only, those three tasks were
# broken by construction. Sourcing them here means the tasks use the pinned,
# lockfile-backed tools instead of whatever happens to be first on PATH.
ruff = ">=0.15,<0.16"
codespell = "*"

[tool.pixi.pypi-dependencies]
triple-correlation = { path = ".", editable = true }

[tool.pixi.feature.dev.pypi-dependencies]
pre-commit = "*"
nbstripout = "*"
ty = "*"
bandit = "*"

[tool.pixi.feature.test.pypi-dependencies]
pytest = ">=8.0"
pytest-cov = ">=3.0"
pytest-xdist = ">=2.5"
pytest-benchmark = "*"
coverage = { version = "*", extras = ["toml"] }

[tool.pixi.environments]
# The default env includes the test feature because `test` is defined under
# [tool.pixi.tasks], which runs in the default env -- so pytest has to be
# resolvable there, not just in dev.
default = { features = ["test"], solve-group = "default" }
dev = { features = ["dev", "test"], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }

[tool.pixi.tasks]
format = "ruff format . && ruff check --fix ."
lint = "ruff check ."
ascii = "python scripts/check_ascii.py"
# `python -m pytest` / `python -m codespell_lib` rather than a bare `pytest` /
# `codespell`, so the tool runs through this environment's interpreter instead
# of resolving against PATH -- PATH resolution is the exact failure mode being
# fixed here.
test = "python -m pytest"
spell = "python -m codespell_lib ."
precommit = "pre-commit run --all-files"

[tool.pixi.feature.dev.tasks]
typecheck = "ty check"
all = { depends-on = ["format", "lint", "ascii", "typecheck", "test"] }

[tool.ty.environment]
python-version = "3.12"
# Pin import resolution to the dev environment. `ty` otherwise infers a
# search path from the interpreter it happens to find, so a machine with a
# system Python on PATH can get different diagnostics than the pixi env
# produces -- and the dev env is the only one that has `ty` installed at all.
# Naming it here makes `typecheck` answer the same question everywhere,
# including under a pre-commit hook that runs with no env activated.
python = ".pixi/envs/dev"

[tool.ty.src]
exclude = [".pixi", "**/*.ipynb"]

# Rules dominated by PyTorch / scientific-library typing gaps (incomplete third-
# party stubs, autograd Function patterns). Downgraded so the high-signal rules
# stay actionable; promote back to "error" individually as stubs improve.
[tool.ty.rules]
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
unsupported-operator = "ignore"
not-iterable = "ignore"
invalid-method-override = "ignore"
not-subscriptable = "ignore"
invalid-type-form = "ignore"
possibly-missing-submodule = "ignore"

[tool.coverage.run]
source = ["fluo"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
]
